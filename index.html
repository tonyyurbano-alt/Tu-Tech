<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TU. | Sites escuros e minimalistas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900;font-size:20px}
nav{display:flex;gap:16px}
nav a{color:#aaa;text-decoration:none;font-size:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px 20px}
h1{font-size:36px;font-weight:900;line-height:0.95;max-width:300px}
h1 span{background:linear-gradient(90deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:#8a8a8e;margin-top:18px;max-width:310px;font-size:16px;line-height:1.5}
.circle-wrap{margin-top:34px;position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.circle-bg{position:absolute;width:100%;height:100%;border-radius:50%;background:#111;border:1px solid #222;box-shadow:0 0 60px rgba(139,92,246,0.6), 0 0 100px rgba(236,72,153,0.3)}
.smoke{position:absolute;width:160px;height:160px;border-radius:50%;background:conic-gradient(from 0deg, #a78bfa, #ec4899, #8b5cf6, #a78bfa);filter:blur(8px);opacity:0.9;animation:spin 8s linear infinite}
.smoke::before{content:'';position:absolute;inset:12px;background:#0a0a0c;border-radius:50%;filter:blur(1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.tu{position:relative;z-index:3;font-size:44px;font-weight:400;letter-spacing:4px}
.btn{margin-top:32px;background:#fff;color:#000;padding:16px 28px;border-radius:100px;font-weight:700;text-decoration:none;font-size:15px;display:inline-flex;box-shadow:0 0 20px rgba(255,255,255,0.2)}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:30px 16px;max-width:400px;margin:0 auto}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:16px 14px}
.card b{font-size:22px;display:block}
.card span{font-size:10px;color:#888;letter-spacing:0.5px;line-height:1.2;display:block;margin-top:4px;text-transform:uppercase}
.wa{position:fixed;bottom:22px;right:18px;background:#25D366;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);z-index:999}
</style>
</head>
<body>
<header><div class="logo">TU.</div><nav><a href="#">Servicos</a><a href="#">Sobre</a><a href="#">Oferta</a></nav></header>
<div class="hero">
<h1>O futuro <span>começa com</span> uma boa ideia.</h1>
<p class="sub">Sou a TU. Crio sites escuros, minimalistas e vendedores para quem quer parecer caro e fechar cliente no WhatsApp.</p>
<div class="circle-wrap">
<div class="circle-bg"></div>
<div class="smoke"></div>
<div class="tu">TU</div>
</div>
<a class="btn" href="https://wa.me/5511975732585?text=Fala%20TU!%20Quero%20meu%20site" target="_blank">Quero meu site agora →</a>
</div>
<div class="cards">
<div class="card"><b>100%</b><span>FEITO PRA VENDER</span></div>
<div class="card"><b>7 dias</b><span>DO ZERO AO AR</span></div>
<div class="card"><b>Direto</b><span>COMIGO NO WHATS</span></div>
</div>
<a class="wa" href="https://wa.me/5511975732585?text=Fala%20TU!" target="_blank">W</a>
</body>
</html>
